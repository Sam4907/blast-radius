name: Blast Radius AI PR Auditor

on:
  push:
    branches:
      - main
      - 'test/**'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  audit-blast-radius:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install python-dotenv requests ibm-watsonx-ai pyvis networkx

      - name: Run Blast Radius CLI Analysis
        run: |
          python cli.py \
            --repo "sample repo/Complex" \
            --func "stripe_api.process" \
            --output "pr_comment.md" \
            --apikey "${{ secrets.WATSONX_APIKEY }}" \
            --project-id "${{ secrets.WATSONX_PROJECT_ID }}" \
            --url "${{ secrets.WATSONX_URL }}"

      - name: Post Audit Comment to PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python post_pr_comment.py pr_comment.md